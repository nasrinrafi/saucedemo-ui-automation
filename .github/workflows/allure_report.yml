name: Automated UI Tests & Allure Report

on:
  push:
    branches: [ main, master ] # اسم برنچ اصلی خودت رو اینجا بذار

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-level: '3.11' # ورژن پایتون خودت

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install allure-pytest
       
        playwright install --with-deps

    - name: Run Pytest Automation Tests
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true

    - name: Get Allure Report History
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Report Site
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report